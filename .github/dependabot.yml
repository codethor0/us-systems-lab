# Dependabot opens pull requests and nothing else. Every update is reviewed and merged by a
# person. Options used here are documented at
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # GitHub applies a 3-day cooldown to version updates by default. Seven days is stated here so
    # that the choice is visible and reviewable.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # vitest and its coverage package are pinned to the same version, so they move together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-config-prettier"
          - "eslint-plugin-react-hooks"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint's peer range excludes this release and everything above it. The value
      # is checked against node_modules by src/repo/dependabot.test.ts, which fails when
      # typescript-eslint widens its range, as a prompt to remove this rule.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # The supported Node major comes from .nvmrc, and the type definitions follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
