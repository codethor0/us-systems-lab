name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly run on main so a broken dependency or runner change shows up without a push.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # Pinned, not ubuntu-latest: the browser suite uses the runner's own Chrome, so an OS
    # move (ubuntu-latest becomes Ubuntu 26 from 2026-10-19) must be its own reviewed change.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the attribution check reads every commit message.
          fetch-depth: 0

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin the release npm version
        run: |
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(npm --version)" = "10.9.2"
          test "$(node --version)" = "v24.18.0"
      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test with the 100 percent coverage threshold
        run: npm run coverage

      - name: Build the production site
        run: npm run build

      - name: Test the repository scripts
        run: npm run test:scripts

      - name: Check for emoji
        run: npm run check:emoji

      - name: Check commit and pull request attribution
        # Passed as environment variables, never interpolated into the shell command.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run check:attribution

      - name: Run production browser verification
        # GitHub-hosted Linux runners cannot create Chrome's sandbox namespaces inside
        # their container; --no-sandbox is the standard, documented mitigation for CI
        # only. The headless browser still only ever loads the local preview server.
        env:
          USL_CHROME_NO_SANDBOX: "1"
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: .artifacts/e2e
          include-hidden-files: true
          retention-days: 5
      - name: Audit dependencies
        run: npm audit --audit-level=low
