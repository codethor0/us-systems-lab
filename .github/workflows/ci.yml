name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin the release npm version
        run: |
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(npm --version)" = "10.9.2"
          test "$(node --version)" = "v24.18.0"
      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test with the 100 percent coverage threshold
        run: npm run coverage

      - name: Build the production site
        run: npm run build

      - name: Test the repository scripts
        run: npm run test:scripts

      - name: Check for emoji
        run: npm run check:emoji

      - name: Run production browser verification
        run: npm run test:e2e
      - name: Audit dependencies
        run: npm audit --audit-level=low
