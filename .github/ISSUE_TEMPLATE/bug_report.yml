name: Bug report
description: Report reproducible application behavior that appears incorrect.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Never include credentials, tokens, private keys, personal data, or other sensitive information.
        Security vulnerabilities must follow SECURITY.md instead of a public issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in a few precise sentences.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reliably reproduces the issue.
      placeholder: |
        1. Open ...
        2. Move ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: scenario
    attributes:
      label: Scenario URL
      description: If relevant, provide the shareable scenario URL after confirming it contains no sensitive information.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser name/version, operating system, viewport or device details, and any relevant Node/npm version.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Sanitized screenshots or logs may be included. Never include credentials or private data.
