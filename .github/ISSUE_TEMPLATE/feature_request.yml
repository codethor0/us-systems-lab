name: Feature request
description: Propose a focused improvement to the public application or repository.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user problem before proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable behavior that would address the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe simpler alternatives, workarounds, or reasons they are insufficient.

  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Note accessibility, performance, static-hosting, privacy, or compatibility constraints that matter.
